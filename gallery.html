  <!--
    HOW TO ADD PHOTOS
    1. Drop image files into site/images/ (keep filenames simple, no spaces).
    2. Copy the <figure> block below, paste it inside the .gallery div,
       remove the comment markers, and update src + alt text.
    3. Commit and push -- the site updates automatically.

    Example:
    <figure>
      <img src="images/sunset.jpg" alt="Sunset over the lake">
      <figcaption>Sunset over the lake, August 2026</figcaption>
    </figure>
  -->

  <div class="gallery">
    <figure>
      <img src="images/cheryl.jpg" alt="Cheryl Smith">
      <figcaption>Cheryl Smith</figcaption>
    </figure>
  </div>
